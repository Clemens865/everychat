services:
  everychat:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${EVERYCHAT_VERSION:-docker-dev}
    container_name: everychat
    depends_on:
      - litellm
    environment:
      EVERYCHAT_ADDR: ":8080"
      EVERYCHAT_DB_PATH: "/app/data/everychat.db"
      EVERYCHAT_BASE_URL: "${EVERYCHAT_BASE_URL:-https://everychat.local}"
      EVERYCHAT_LITELLM_URL: "http://litellm:4000"
    volumes:
      - ./data:/app/data
    expose:
      - "8080"
    restart: unless-stopped

  litellm:
    build:
      context: ./internal/llm/litellm
      dockerfile: Dockerfile
    container_name: everychat-litellm
    environment:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY required — see .env.example}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:?OPENAI_API_KEY required — see .env.example}"
      VOYAGE_API_KEY: "${VOYAGE_API_KEY:-}"
    expose:
      - "4000"
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    container_name: everychat-caddy
    depends_on:
      - everychat
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.compose:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
