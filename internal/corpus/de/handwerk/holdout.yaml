# Handwerk · Hold-out v1
#
# 50 hold-out questions for HoldoutRunner. Strictly disjoint from
# questions.yaml (ids c1–c15). Loader (`internal/corpus`) enforces this
# via ErrHoldoutOverlap — any id collision fails the build.
#
# Topical disjointness rule:
#   The c-set covers Kunden-Kern (Notdienst, Kostenvoranschlag,
#   Stundensatz, Gewährleistung, …) plus the two refusal paths every
#   Handwerk bot must hold (Versicherungsregulierung, Eigenreparatur-
#   Beratung am Telefon).
#   The h-set covers ADJACENT specifics — the long tail of "kennt euer
#   Bot diese konkrete Detailfrage?" probes that a Endkunde mit
#   konkretem Sanierungsproblem stellen würde.
#
# Curation notes:
#   - id prefix `h` (vs `c`) makes id-collision impossible.
#   - must_contain hints stay coherent under both keyword and
#     llm_judge scoring.
#   - DESIGN-PARTNER REVIEW TODO: like questions.yaml, this is
#     autonomous-build content. Run past the first design-partner
#     SHK-Betrieb before treating as the moat.

bot: handwerk-corpus
questions:
  - id: h1-waermepumpe-eignung
    ask: "Lohnt sich eine Wärmepumpe in einem 1970er Altbau?"
    must_contain: ["Wärmepumpe"]
    max_tokens: 450

  - id: h2-hydraulischer-abgleich
    ask: "Was ist ein hydraulischer Abgleich und brauche ich den wirklich?"
    must_contain: ["hydraulische"]
    max_tokens: 400

  - id: h3-brennwert-vs-hybrid
    ask: "Soll ich eine reine Gas-Brennwerttherme oder eine Hybrid-Lösung mit Wärmepumpe nehmen?"
